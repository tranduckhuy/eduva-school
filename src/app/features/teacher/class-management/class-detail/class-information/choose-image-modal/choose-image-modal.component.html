<div
  class="max-h-[calc(100vh-40px)] w-full overflow-y-auto rounded bg-white dark:bg-dark-300">
  <header
    class="sticky left-0 top-0 z-[1] block w-full rounded-t-lg bg-gray-50 p-[25px] dark:bg-dark-400">
    <h2 class="text-lg xs:hidden">Chọn hình nền cho lớp học</h2>
    <h2 class="hidden text-lg xs:block">Chọn hình nền</h2>
    <span
      class="pi pi-times absolute right-[5px] top-[50%] -translate-y-[50%] cursor-pointer px-5 py-3 text-xl"
      (click)="closeModal()"></span>
  </header>

  <div class="mt-[25px] w-[calc(100vw-80px)] px-[25px] pb-0 xs:w-[350px]">
    <div class="grid grid-cols-3 gap-3 lg:grid-cols-2 sm:grid-cols-1">
      @for (url of backgroundImageUrls(); track $index) {
        <div class="col-span-1">
          <div
            class="group relative col-span-1 cursor-pointer rounded-lg border-4"
            [ngClass]="{
              'border-primary bg-primary/10': selectedImageUrl() === url,
              'border-transparent': selectedImageUrl() !== url,
            }"
            (click)="selectImage(url)">
            @if (selectedImageUrl() === url) {
              <span
                class="pi pi-check-circle absolute left-3 top-3 z-[1] text-white"
                style="font-size: 20px; font-weight: 600"></span>
            }
            <img
              class="h-32 w-full rounded object-cover transition-opacity duration-200 group-hover:opacity-80"
              [src]="url"
              [alt]="'Image ' + $index" />
          </div>
        </div>
      }
    </div>
  </div>

  <footer
    class="sticky bottom-0 left-0 z-[1] flex justify-end gap-2 bg-white p-[25px] dark:bg-dark-300">
    <p-button
      label="Hủy"
      variant="outlined"
      severity="danger"
      icon="pi pi-times"
      size="small"
      (onClick)="closeModal()" />
    <p-button
      label="Lưu"
      variant="outlined"
      size="small"
      icon="pi pi-save"
      [loading]="isLoading()"
      [disabled]="isLoading() || !selectedImageUrl()"
      (onClick)="onSave()" />
  </footer>
</div>
